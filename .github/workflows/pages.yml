# Publicerar videoteket (mappen public/) till GitHub Pages vid varje push till main.
# Adressen: https://rw222ix-eng.github.io/matematikvideor/
name: Publicera videoteket
on:
  push:
    branches: [main]
  workflow_dispatch:
# Inga rättigheter som standard (2026-10-27). Jobbet får bara det det behöver, så att ett kapat steg
# i ett annat jobb inte kan skriva till repot.
permissions: {}
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicera:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
      attestations: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # persist-credentials: false: checkout sparar inte sin token i klonen, så stegen efter kan inte pusha.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Filmsidorna (förhandsbilden i Classroom) skrivs om ur videor.json vid varje publicering, så att
      # de aldrig pekar på ett gammalt omslag när en publicering återställt dem. Sidans skript flyttas
      # till app.<hash>.js och policyn blir strikt (verktyg/publicera.mjs, samma steg som hos Vercel).
      # --vidarekoppla (säkerhet 3a, 2026-10-27): Pages kan inte skicka säkerhetshuvuden, så startsidan
      # här skickar eleven vidare till samma ställe hos Vercel, med det eleven sparat. Ta bort flaggan
      # så blir Pages en full kopia av videoteket igen, till exempel om Vercel ligger nere.
      - run: node verktyg/publicera.mjs --vidarekoppla
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      # v5 låser sin egen upload-artifact på SHA, vilket repots krav på SHA-låsning kräver (2026-10-27).
      # include-hidden-files: true tar med .well-known/ som v3 gjorde.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public
          include-hidden-files: true
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
      # Härkomst (SLSA Build L2) för varje fil som publicerades: vilken commit och vilket workflow som
      # byggde den. En fil från sidan kontrolleras med
      #   gh attestation verify <fil> -R rw222ix-eng/matematikvideor
      # Steget ligger efter publiceringen, så att ett avbrott hos Sigstore inte stoppar sidan.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "public/**"
