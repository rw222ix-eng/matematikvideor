# Publicerar videoteket (mappen public/) vid varje push till main: till Cloudflare Pages
# (https://winterhalls-matte.pages.dev, med inbäddningen på https://matematikvideor-inbaddat.pages.dev) och till
# GitHub Pages (https://rw222ix-eng.github.io/matematikvideor/), som skickar vidare till Cloudflare.
name: Publicera videoteket
on:
  push:
    branches: [main]
  workflow_dispatch:
# Inga rättigheter som standard (2026-10-27). Jobbet får bara det det behöver, så att ett kapat steg
# i ett annat jobb inte kan skriva till repot.
permissions: {}
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicera:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
      attestations: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # persist-credentials: false: checkout sparar inte sin token i klonen, så stegen efter kan inte pusha.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Filmsidorna (förhandsbilden i Classroom) skrivs om ur videor.json vid varje publicering, så att
      # de aldrig pekar på ett gammalt omslag när en publicering återställt dem. Sidans skript flyttas
      # till app.<hash>.js och policyn blir strikt (verktyg/publicera.mjs, samma steg som hos Cloudflare och Vercel).
      # --vidarekoppla (säkerhet 3a, 2026-10-27): Pages kan inte skicka säkerhetshuvuden, så startsidan
      # här skickar eleven vidare till samma ställe hos Cloudflare, med det eleven sparat. Ta bort flaggan
      # så blir Pages en full kopia av videoteket igen, till exempel om Cloudflare ligger nere.
      - run: node verktyg/publicera.mjs --vidarekoppla
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      # v5 låser sin egen upload-artifact på SHA, vilket repots krav på SHA-låsning kräver (2026-10-27).
      # include-hidden-files: true tar med .well-known/ som v3 gjorde.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public
          include-hidden-files: true
      - id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
      # Härkomst (SLSA Build L2) för varje fil som publicerades: vilken commit och vilket workflow som
      # byggde den. En fil från sidan kontrolleras med
      #   gh attestation verify <fil> -R rw222ix-eng/matematikvideor
      # Steget ligger efter publiceringen, så att ett avbrott hos Sigstore inte stoppar sidan.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "public/**"

  # Cloudflare Pages (flytten från Vercel 2026-11-07, Rickard: "Flytta båda"). Uppladdning härifrån räknas inte mot
  # gratisplanens 500 byggen i månaden. Hemligheten CLOUDFLARE_API_TOKEN får bara ändra Pages på kontot.
  # Huvudena skrivs ur verktyg/huvuden.json och inbaddat/huvuden.mjs till _headers, så att policyn står på samma ställen som förut.
  # Inbäddningen går ut först, eftersom sidan bäddar in den och den måste tillåta sidans adress.
  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    concurrency:
      group: cloudflare
      cancel-in-progress: true
    env:
      CLOUDFLARE_ACCOUNT_ID: 394c95aa3566744a83a21167defe139d
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: node inbaddat/huvuden.mjs --kontroll && node inbaddat/huvuden.mjs --cloudflare
      # Spelen (2026-11-09, «Inne i videoteket»): filerna i spel-filer.json hämtas från geogebra-guiden.pages.dev till
      # public/spel/, och varje hash kontrolleras (verktyg/spel.mjs).
      - run: node verktyg/spel.mjs
      - run: node verktyg/publicera.mjs --cloudflare
      # Finns projektet redan svarar kommandot med ett fel, och det gör inget.
      - run: npx --yes wrangler@4.158.0 pages project create matematikvideor-inbaddat --production-branch main || true
      # Inbäddningen publiceras från sin egen mapp, så att videotekets functions/ och wrangler.toml i roten inte följer med.
      - run: npx --yes wrangler@4.158.0 pages deploy public --project-name matematikvideor-inbaddat --branch main --commit-dirty=true
        working-directory: inbaddat
      - run: npx --yes wrangler@4.158.0 pages project create winterhalls-matte --production-branch main || true
      # Från roten: functions/spel/ (spelservern) och wrangler.toml (service bindingen SPEL) följer med.
      - run: npx --yes wrangler@4.158.0 pages deploy public --project-name winterhalls-matte --branch main --commit-dirty=true
