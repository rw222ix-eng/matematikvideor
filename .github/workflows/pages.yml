# Publicerar videoteket (mappen public/) till GitHub Pages vid varje push till main.
# Adressen: https://rw222ix-eng.github.io/matematikvideor/
name: Publicera videoteket
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicera:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Filmsidorna (förhandsbilden i Classroom) skrivs om ur videor.json vid varje publicering, så att
      # de aldrig pekar på ett gammalt omslag när en publicering återställt dem.
      - run: node verktyg/filmsidor.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
