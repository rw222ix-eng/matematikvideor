# Publicerar videoteket (mappen public/) till GitHub Pages vid varje push till main.
# Adressen: https://rw222ix-eng.github.io/matematikvideor/
name: Publicera videoteket
on:
  push:
    branches: [main]
  workflow_dispatch:
# Inga rättigheter som standard (2026-10-27). Jobbet får bara det det behöver, så att ett kapat steg
# i ett annat jobb inte kan skriva till repot.
permissions: {}
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  publicera:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
      attestations: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # persist-credentials: false: checkout sparar inte sin token i klonen, så stegen efter kan inte pusha.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Filmsidorna (förhandsbilden i Classroom) skrivs om ur videor.json vid varje publicering, så att
      # de aldrig pekar på ett gammalt omslag när en publicering återställt dem.
      - run: node verktyg/filmsidor.mjs
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
      # Härkomst (SLSA Build L2) för varje fil som publicerades: vilken commit och vilket workflow som
      # byggde den. En fil från sidan kontrolleras med
      #   gh attestation verify <fil> -R rw222ix-eng/matematikvideor
      # Steget ligger efter publiceringen, så att ett avbrott hos Sigstore inte stoppar sidan.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "public/**"
