<meta name="description" content="Den 5 september 1862 stiger James Glaisher upp i en ballong från Wolverhampton för att mäta hur kallt det är högt uppe i luften. Han skriver ner höjden i en anteckningsbok, tills han svimmar. Vi ritar resan i ett koordinatsystem och ser att höjden är en funktion av tiden: varje tid ger exakt en höjd. Vi skriver f(t), räknar med formeln f(t) = 170t och tar fram definitionsmängden och värdemängden.">
