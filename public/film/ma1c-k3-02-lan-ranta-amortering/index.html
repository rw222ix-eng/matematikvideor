<title>Yunus och lånet · Ma 1c, Lån, ränta och amortering</title>
<meta name="description" content="År 1976 går professorn Muhammad Yunus in i byn Jobra i Bangladesh. Sufia Begum flätar pallar av bambu, men pengarna till bambun lånar hon av en handlare, och efter en hel dags arbete har hon 50 paisa kvar. En granne betalar 10 % ränta i veckan. Vi räknar räntan som lånet · räntesatsen, ett års ränta på 100 taka (520 taka, årsränta 520 %) och ränta på ränta med förändringsfaktorn: 1,10⁵² ≈ 142. Sedan lånar Sufia 1 000 taka av Yunus och amorterar 20 taka i veckan. Räntan räknas bara på skulden, så den blir 8 paisa mindre varje vecka, och hela årets ränta blir 100 taka.">
