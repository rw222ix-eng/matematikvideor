<title>Delos och altaret · Ma 1c / Ma 2a / Ma 2c, Lösa potensekvationer</title>
<meta name="description" content="Omkring år 430 före Kristus kommer pesten till ön Delos. Apollons prästinna svarar att altaret, en kub av sten, ska bli dubbelt så stort, men byggmästaren dubblar sidan och altaret blir åtta gånger så stort. Sidan som ger ett dubbelt så stort altare är lösningen till potensekvationen x³ = 2: vi höjer båda leden till en tredjedel med formelbladets regler. Sedan udda och jämn exponent, att skriva om först och en parentes. Till sist Eratosthenes bronsmaskin.">
