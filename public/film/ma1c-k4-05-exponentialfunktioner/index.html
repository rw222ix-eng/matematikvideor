<meta name="description" content="Sommaren 1789 skrev Benjamin Franklin i sitt testamente att 1000 pund, utlånade mot 5 % ränta, skulle bli 131 000 pund på hundra år. Vi förklarar förändringsfaktorn (5 % mer är gånger 1,05), bygger exponentialfunktionen y = C · aˣ år för år och kontrollerar Franklins svar på räknaren. Sedan jämför vi med ett linjärt samband, ser hur en förändringsfaktor under 1 gör en funktion avtagande och läser av startvärde och procent direkt ur funktionen.">
