<meta name="description" content="Sommaren 1789 skrev Benjamin Franklin i sitt testamente att 1000 pund, utlånade mot 5 % ränta, skulle bli 131 000 pund på hundra år. Vi följer pengarna ett år i taget och ser hur räntan ger ränta. Fem procent till är samma sak som gånger 1,05, exponenten räknar hur många år vi tar gånger, och vi kollar Franklins svar på räknaren. Formeln y = C · aˣ kommer sist. Sedan jämför vi med ett linjärt samband, ser hur en bil som tappar i värde ger en avtagande funktion och läser av startvärde och procent direkt ur funktionen.">
