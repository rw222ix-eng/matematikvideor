<title>Alfred och ljusklockan · Ma 1c, Formler och modeller, sätta in, lösa ut en variabel, rimlighet</title>
<meta name="description" content="Kung Alfred i södra England på 880-talet hade inga klockor. Han lät göra sex ljus med tolv streck på varje, och de räckte ett helt dygn. Ur hans tal ställer vi upp formeln L = 12 − 3t och förklarar beroende och oberoende variabel och fast och rörlig del. Vi sätter in i formeln, löser ekvationen 3 = 12 − 3t med balansmetoden och löser ut t ur formeln. Sedan jämför vi två modeller, ett ljus i stilla luft och ett i blåst, och ser varför modellen bara gäller när 0 ≤ t ≤ 4.">
