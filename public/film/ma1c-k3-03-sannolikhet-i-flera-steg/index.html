<meta name="description" content="Våren 1856 börjar munken Gregor Mendel korsa ärtplantor i klostrets trädgård i Brno. Han räknar 8 023 ärtor, och ungefär var fjärde blir grön. Varför? Vi går från slumpförsök, utfall och händelse till sannolikheten som gynnsamma delat med möjliga utfall, ritar Mendels anlag i en tabell och sedan i ett träddiagram, multiplicerar längs en gren (½ · ½ = ¼), adderar mellan grenar och räknar med två egenskaper samtidigt: gul och rund, ¾ · ¾ = 9/16.">
