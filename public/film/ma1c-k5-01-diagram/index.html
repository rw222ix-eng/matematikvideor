<meta name="description" content="Hösten 1857 sitter Florence Nightingale på ett hotellrum i London med arméns listor över soldaterna som dog i Krimkriget. Hennes första diagram visar rätt tal, men ser ändå fel ut. Hur kan ett diagram lura ögat? Vi läser januari 1855 ur tabellen, skiljer på antal och andel (2 800 av 3 200 ≈ 88 %), ritar stapeldiagram, cirkeldiagram med vinkeln = andelen · 360°, linjediagram och histogram, och ser två sätt att lura: en axel som inte börjar på noll och ytor som växer fyra gånger när talet bara dubblas.">
