<title>Thorp och kortleken · Ma 1c, Beroende händelser och komplementhändelse</title>
<meta name="description" content="Våren 1961 sitter Edward Thorp, 28 år och lärare i matematik vid MIT, vid ett spelbord på ett kasino vid sjön Tahoe. Korten som har delats ut läggs inte tillbaka i leken. Hur stor är chansen att han får minst ett ess? Vi räknar sannolikheten för nästa kort utan återläggning, skiljer på beroende och oberoende händelser, ritar ett träddiagram och multiplicerar längs grenen (4/10 · 3/9 ≈ 13 %). Sedan räknar vi minst ett ess som komplementhändelsen till inget ess: 1 − 1/3 = 2/3. Med återläggning blir det 64 %.">
