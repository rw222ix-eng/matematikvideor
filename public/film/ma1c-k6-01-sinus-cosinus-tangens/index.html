<meta name="description" content="Skrivaren Ahmes i Egypten omkring 1550 f.Kr. och hans räknebok med uppgifter om hur mycket en pyramid skulle luta. En liten och en stor pyramid har samma kvot mellan sidorna, för kvoten beror bara på vinkeln. Sidorna får namn — hypotenusa, motstående och närliggande katet — och kvoterna heter sinus, cosinus och tangens. Räknaren (TI-30X Pro) i grader, en sida ur en vinkel, och den sneda sidan på en liten pyramid med x under bråkstrecket. Rhindpapyrusen på British Museum.">
