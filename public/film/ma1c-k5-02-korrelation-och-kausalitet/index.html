<meta name="description" content="Våren 1948 dör allt fler män i England av lungcancer, och ingen vet varför. Läkaren Richard Doll och statistikern Austin Bradford Hill frågar patienter på tjugo sjukhus i London hur mycket de röker. Vi går igenom population, stickprov och urval, jämförelsegrupp och bortfall, räknar andelar ur tabellen och ser vad korrelation betyder, i ett punktdiagram och med en nollhypotes. Sist frågar vi om korrelationen visar en orsak, eller om en tredje variabel kan ligga bakom.">
