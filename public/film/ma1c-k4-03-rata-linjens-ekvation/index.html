<title>Earhart och linjen · Ma 1c / Ma 2a, Bestämma räta linjens ekvation ur två punkter</title>
<meta name="description" content="Den 2 juli 1937 flög Amelia Earhart och Fred Noonan mot den lilla ön Howland mitt i Stilla havet. Vi tar fram kurslinjens ekvation ur två punkter och prövar om en punkt ligger på linjen. Sedan följer vi Noonans solens linje, som är vinkelrät mot riktningen till solen och flyttas parallellt genom ön. Till sist skriver vi om en linje från allmän form till y = kx + m.">
