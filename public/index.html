<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Matematikvideor med Rickard</title>
<meta name="description" content="Korta filmer om matematik på gymnasiet, berättade genom historien. Sök på det du tycker är svårt och hoppa direkt till stället i filmen.">
<meta name="theme-color" content="#171414">
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='44' fill='none' stroke='%23ECE6D8' stroke-width='4'/%3E%3Ccircle cx='50' cy='50' r='7' fill='%23ECE6D8'/%3E%3Ccircle cx='82' cy='34' r='6' fill='%23F2C572'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Cormorant+Garamond:ital,wght@0,500;1,500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #171414; --bg2: #201c1c; --ben: #ECE6D8; --ben2: #B5AE9F; --dis: #7A7369;
    --linje: rgba(236, 230, 216, 0.22); --linje2: rgba(236, 230, 216, 0.1); --accent: #F2C572;
    --sans: "Jost", "Josefin Sans", "Futura", "Avenir Next", "Helvetica Neue", sans-serif;
    /* Rubrikerna var skrivstil (Pinyon Script) och gick knappt att läsa (Rickard 2026-09-23). */
    --skrift: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
    --ton: 1s; --lugn: cubic-bezier(.22, .61, .36, 1);
  }
  * { box-sizing: border-box; }
  html { color-scheme: dark; background: var(--bg); -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; min-height: 100dvh; background: var(--bg); color: var(--ben); font: 300 17px/1.7 var(--sans); overflow-x: hidden; }
  body.last { overflow: hidden; }
  a { color: inherit; text-decoration: none; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
  :focus-visible { outline: 1px solid var(--accent); outline-offset: 4px; }
  img { display: block; }

  /* (Filmkornslagret är borttaget: ett animerat lager över hela sidan gjorde scroll och allt annat trögt.) */

  /* Typografi */
  .etikett { font: 500 11px/1.6 var(--sans); letter-spacing: .34em; text-transform: uppercase; color: var(--ben2); margin: 0; }
  .skrift { font: 500 clamp(54px, 9.5vw, 118px)/1.1 var(--skrift); letter-spacing: .01em; color: var(--ben); margin: 0; padding: 0 .25em; overflow: visible; text-shadow: 0 2px 10px rgba(0, 0, 0, .55); }
  /* Et-tecknet i kursiv: Garamonds kursiva & är den enda utsmyckningen som blev kvar. */
  .skrift .amp { font-style: italic; }
  .brod { font-weight: 300; color: var(--ben2); font-size: 17px; line-height: 1.85; }

  /* Vyer */
  .vy:not(.aktiv) { display: none; }
  .vy.aktiv.in { animation: ton var(--ton) var(--lugn) both; }
  @keyframes ton { from { opacity: 0 } to { opacity: 1 } }

  /* Toppraden med logotypen */
  .topp { position: absolute; top: 0; left: 0; right: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; padding: 28px 32px; }
  .logo { display: inline-flex; align-items: center; opacity: .95; transition: opacity .5s; }
  .logo:hover { opacity: 1; }
  .logo img { height: 64px; width: 64px; display: block; border-radius: 50%; box-shadow: 0 0 0 1px var(--linje2), 0 12px 30px -10px rgba(0, 0, 0, .9); }
  .intro .logo img { height: 92px; width: 92px; }
  .ikon { width: 44px; height: 44px; display: grid; place-items: center; color: var(--ben2); transition: color .4s; }
  .ikon:hover { color: var(--ben); }
  .ikon svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.2; stroke-linecap: round; }
  .topp .hoger { display: flex; align-items: center; gap: 4px; margin-left: auto; }

  /* ── 1. Intro ─────────────────────────────────────────── */
  /* min-height i stället för height: på låga/smala skärmar får introt växa så rubriken inte krockar med logotypen. */
  .intro { position: relative; min-height: 100vh; min-height: 100dvh; overflow: hidden; display: grid; grid-template-rows: minmax(130px, 1fr) auto minmax(100px, 1fr); place-items: center; text-align: center; padding: 0 20px; }
  /* Introt får inte rulla (body.last), så allt måste rymmas på höjden: rubriken skalar även med vh och knappens marginal krymper på låga skärmar. */
  .intro .skrift { font-size: clamp(48px, min(9.5vw, 15vh), 118px); }
  /* Ingen zoom på introt: fonden är uppskalad från 720 px och inzoomad ser den pixlig ut (Rickard 2026-09-12). */
  .intro .fond { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; }
  @keyframes zoom { from { transform: scale(1.09) } to { transform: scale(1) } }
  /* Samma bild ritad i WebGL, med levande stjärnor och ljus. Syns först när första bilden
     är ritad; fungerar inte WebGL ligger den vanliga bilden kvar under. */
  .intro .levande { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; opacity: 0; pointer-events: none; }
  .intro .levande.klar { opacity: 1; }
  .intro .vinjett { position: absolute; inset: 0; z-index: 1; background:
      radial-gradient(ellipse 70% 60% at 50% 45%, rgba(23, 20, 20, 0) 0%, rgba(23, 20, 20, .3) 60%, rgba(23, 20, 20, .7) 100%),
      linear-gradient(rgba(23, 20, 20, .35), rgba(23, 20, 20, 0) 30%, rgba(23, 20, 20, 0) 65%, rgba(23, 20, 20, .6)); }
  .intro .topp { justify-content: center; }
  .intro .mitt { position: relative; z-index: 2; grid-row: 2; max-width: 760px; }
  .intro .ingress { font: 300 clamp(16px, 1.6vw, 19px)/1.8 var(--sans); color: var(--ben2); margin: clamp(14px, 3vh, 30px) auto 0; max-width: 560px; }
  .intro .knapp { position: relative; z-index: 2; grid-row: 3; align-self: end; margin-bottom: clamp(28px, 6vh, 80px); display: inline-flex; align-items: center; gap: 16px; font: 400 15px/1 var(--sans); letter-spacing: .22em; text-transform: uppercase; color: var(--accent); }
  .intro .knapp .ring { width: 46px; height: 46px; border: 1px solid var(--accent); border-radius: 50%; display: grid; place-items: center; transition: background .5s, color .5s; }
  .intro .knapp .ring svg { width: 12px; height: 12px; fill: currentColor; margin-left: 2px; }
  .intro .knapp:hover .ring { background: var(--accent); color: var(--bg); }
  .intro .fram { opacity: 0; animation: fram 1.4s var(--lugn) forwards; }
  .intro .topp.fram { animation-delay: .4s; }
  .intro h1.fram { animation-delay: .9s; }
  .intro .ingress.fram { animation-delay: 1.6s; }
  .intro .knapp.fram { animation-delay: 2.3s; }
  @keyframes fram { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: none } }

  /* ── 2. Välj en film ──────────────────────────────────── */
  /* Bakgrunden är målningens egen färg längst ner (medel av nedersta raderna), så att det
     som blir över under bilden ser ut som den mörka förgrunden som fortsätter. */
  .valj { display: block; position: relative; height: 100vh; height: 100dvh; overflow: hidden; background: #2b3134; }
  /* Målningen fyller alltid hela bredden och sitter fäst i överkanten: aldrig förstorad,
     aldrig kapad på sidorna, så stad och galax syns hela (Rickard 2026-09-23). Är fönstret
     bredare än 16:9 kapas en bit av den mörka förgrunden nedtill; är det högre fortsätter
     bakgrunden i målningens nederkantsfärg, och skarven tonas på 16 px. En suddig kopia
     som fyllnad syntes som en grå, suddig remsa och är borttagen. */
  .valj .fond { position: absolute; top: 0; left: 0; width: 100%; height: auto; aspect-ratio: 1672 / 940; z-index: 0;
    -webkit-mask-image: linear-gradient(#000 calc(100% - 16px), transparent); mask-image: linear-gradient(#000 calc(100% - 16px), transparent); }
  /* Vinjetten är nedtonad till ungefär hälften (Rickard 2026-09-13, "lite ljusare" två gånger): fonden ska synas lite mer,
     men kanterna måste fortfarande mörkna så tidslinjens text går att läsa. */
  .valj .vinjett { position: absolute; inset: 0; z-index: 1; background:
      radial-gradient(ellipse 80% 70% at 50% 30%, rgba(23, 20, 20, 0) 0%, rgba(23, 20, 20, .03) 60%, rgba(23, 20, 20, .16) 100%),
      linear-gradient(rgba(23, 20, 20, .09), rgba(23, 20, 20, 0) 25%, rgba(23, 20, 20, 0) 60%, rgba(23, 20, 20, .38) 88%); }
  /* Glimret ligger på målningens egna stjärnor, inte på utslumpade prickar ovanpå den:
     verktyg/hitta-stjarnor.py letar upp dem i fonden och skriver public/stjarnor.json.
     En canvas med färdiga sprites, inget filter per bildruta. Lagret ligger ovanpå
     vinjetten men under tidslinjen. */
  .valj .stjarnor { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 1; pointer-events: none; }
  .valj .tidslinje { z-index: 2; }
  /* "Välj en film" syntes dåligt mot himlen i 11 px (Rickard 2026-09-23): större, ljusare, med skugga. */
  .valj .rubrik { position: absolute; top: 106px; left: 0; right: 0; text-align: center; z-index: 4; pointer-events: none; font-size: 16px; letter-spacing: .3em; color: var(--ben); text-shadow: 0 1px 3px rgba(0, 0, 0, .9), 0 0 16px rgba(0, 0, 0, .8); }
  /* Ingen textmarkering: drar man tidslinjen ska inte årtal och titlar markeras på vägen. */
  .tidslinje { position: absolute; top: 150px; bottom: 0; left: 0; right: 0; overflow: hidden; cursor: grab; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
  .tidslinje.drar { cursor: grabbing; }
  .tidslinje::before { content: ""; position: absolute; left: 0; right: 0; bottom: 168px; height: 1px; background: var(--linje2); }
  .spar { display: flex; align-items: stretch; height: 100%; padding: 0 max(12vw, 80px); will-change: transform; width: max-content; }
  .post { --lyft: 6vh; width: 320px; margin-right: 90px; display: flex; flex-direction: column; align-items: center; height: 100%; flex: none; }
  .post:nth-child(4n+2) { --lyft: 24vh; }
  .post:nth-child(4n+3) { --lyft: 13vh; }
  .post:nth-child(4n+4) { --lyft: 31vh; }
  /* På låga fönster är det upphängningen som får ge efter, aldrig ramen: krympte ramen
     blev omslaget bredare än 16:9 och beskars upptill och nedtill (Galilei, 2026-09-23). */
  .post .lyft { height: var(--lyft); flex: 0 1 auto; min-height: 0; }
  .post .ram { flex: none; width: 100%; aspect-ratio: 16/9; overflow: hidden; background: var(--bg2); transform-origin: center bottom; transition: transform .5s var(--lugn), box-shadow .5s var(--lugn); box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .8); }
  /* Korten i vila: full opacitet (den gamla .55 mot den mörka fonden var en mörk wash
     som gömde bilden) och bara en lätt avmättning, så hover ändå gör skillnad. Ljuset
     i bilderna kommer ur filerna: bygg.mjs lyfter skuggorna med en kurva. */
  .post .ram img { width: 100%; height: 100%; object-fit: cover; filter: grayscale(.35) brightness(1) contrast(1); opacity: 1; transition: opacity .5s var(--lugn), filter .5s var(--lugn), transform .5s var(--lugn); }
  .post .lina { flex: 1; width: 1px; background: linear-gradient(var(--linje), var(--linje2)); position: relative; min-height: 40px; }
  .post .lina::after { content: ""; position: absolute; left: -2.5px; bottom: -2.5px; width: 6px; height: 6px; border-radius: 50%; background: var(--dis); }
  /* Texten under korten ska gå att läsa på avstånd, ovanpå stadens ljus (Rickard 2026-09-23):
     större grader, ljusare färg och en skugga som lyfter den från målningen. */
  .post .namn { height: 168px; padding-top: 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; transform-origin: top center; transition: transform .5s var(--lugn); text-shadow: 0 1px 3px rgba(0, 0, 0, .9), 0 0 14px rgba(0, 0, 0, .75); }
  .post .kurs { font: 400 22px/1 var(--sans); letter-spacing: .12em; color: var(--ben); text-transform: uppercase; transition: color .5s var(--lugn); }
  .post .moment { font: 500 13px/1.5 var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--ben); max-width: 340px; transition: color .5s var(--lugn); }
  .post .titel { font: italic 400 21px/1.3 var(--sans); color: var(--ben); letter-spacing: .02em; margin-top: 2px; transition: color .5s var(--lugn); }
  /* Hovring (Rickard 2026-09-13): tydlig taktil återkoppling — kortet kliver fram och
     texten under växer och ljusnar. Bara på pekdon som hovrar; mobilen har ingen hover
     och står still. Det hovrade kortet får z-index så det lägger sig över grannarna. */
  @media (hover: hover) {
    .post:hover, .post:focus-within { position: relative; z-index: 3; }
    .post:hover .ram, .post:focus-within .ram { transform: scale(1.09); box-shadow: 0 40px 80px -20px rgba(0, 0, 0, .9); }
    .post:hover .ram img, .post:focus-within .ram img { opacity: 1; filter: none; transform: scale(1.03); }
    .post:hover .namn, .post:focus-within .namn { transform: scale(1.08); }
    .post:hover .kurs, .post:focus-within .kurs { color: #FFFBF2; }
    .post:hover .moment, .post:focus-within .moment { color: var(--ben); }
    .post:hover .titel, .post:focus-within .titel { color: var(--accent); }
  }
  .post > button { all: unset; display: contents; }
  .post.kommer { pointer-events: none; }
  .post.kommer .ram { background: none; border: 1px dashed var(--linje2); box-shadow: none; }
  .post.kommer .kurs { color: var(--dis); }
  .post.kommer .moment { color: var(--dis); opacity: .6; }
  .post.kommer .lina { opacity: .5; }
  .post.kommer .lina::after { background: var(--bg2); border: 1px solid var(--linje2); }
  /* Pilen lika vit som "Välj en film", med samma skugga (Rickard 2026-09-23). */
  .valj .hint { position: absolute; top: 146px; left: 0; right: 0; display: flex; justify-content: center; z-index: 4; pointer-events: none; color: var(--ben); filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .9)) drop-shadow(0 0 8px rgba(0, 0, 0, .7)); transition: opacity 1s; animation: vagga 3s ease-in-out infinite; }
  .valj .hint svg { width: 64px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .valj .hint.borta { opacity: 0; }
  @keyframes vagga { 0%, 100% { transform: translateX(-4px) } 50% { transform: translateX(4px) } }
  .valj .aterstall { opacity: 0; pointer-events: none; transition: opacity .6s; }
  .valj .aterstall.syns { opacity: 1; pointer-events: auto; }

  /* ── Sök ──────────────────────────────────────────────── */
  .sok { position: fixed; inset: 0; z-index: 40; background: rgba(23, 20, 20, .97); display: none; overflow-y: auto; }
  .sok.oppen { display: block; animation: ton .7s var(--lugn) both; }
  .sok .inre { max-width: 760px; margin: 0 auto; padding: 150px 24px 120px; }
  .sok label { display: block; margin-bottom: 26px; }
  .sok input { width: 100%; font: 300 clamp(26px, 4vw, 40px)/1.3 var(--sans); color: var(--ben); background: none; border: 0; border-bottom: 1px solid var(--linje); padding: 6px 0 14px; outline: none; letter-spacing: .01em; }
  .sok input::placeholder { color: var(--dis); }
  .sok input::-webkit-search-cancel-button { display: none; }
  .sok input:focus { border-color: var(--ben2); }
  .sok .status { margin: 22px 0 0; font: 300 10px/1.6 var(--sans); letter-spacing: .3em; text-transform: uppercase; color: var(--dis); }
  .traff-film { margin-top: 56px; animation: fram 1s var(--lugn) both; }
  .traff-film h3 { margin: 0 0 6px; }
  .traff-film h3 button { all: unset; cursor: pointer; }
  .traff-film h3 button:hover { color: var(--ben); }
  .traff-film .titel { font: 400 24px/1.3 var(--skrift); font-size: 34px; color: var(--ben); margin: 0 0 18px; }
  .traff-film .titel button { all: unset; cursor: pointer; }
  .traff-film .titel button:hover { color: var(--accent); }
  .traff-film ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--linje2); }
  .traff-film li { border-bottom: 1px solid var(--linje2); }
  .traff-film li button { all: unset; cursor: pointer; display: grid; grid-template-columns: 74px 1fr; gap: 16px; padding: 16px 0; width: 100%; align-items: baseline; }
  .traff-film li button:hover .snutt { color: var(--ben); }
  .tid { font: 500 11px/1.8 var(--sans); letter-spacing: .3em; color: var(--accent); font-variant-numeric: tabular-nums; }
  .snutt { color: var(--ben2); font-weight: 300; transition: color .4s; }
  mark { background: none; color: var(--ben); font-weight: 400; border-bottom: 1px solid var(--accent); }
  .traff-film .fler { padding: 14px 0 0; font: italic 300 14px/1.5 var(--sans); color: var(--dis); }

  /* ── 3. Filmens sida ──────────────────────────────────── */
  .film { display: block; position: relative; min-height: 100vh; background: var(--bg); padding-bottom: 120px; }
  .film .topp { position: sticky; background: linear-gradient(var(--bg) 60%, rgba(23, 20, 20, 0)); }
  .film .tillbaka { font: 400 10px/1 var(--sans); letter-spacing: .3em; text-transform: uppercase; color: var(--ben2); display: inline-flex; align-items: center; gap: 12px; transition: color .4s; }
  .film .tillbaka:hover { color: var(--ben); }
  .film .tillbaka svg { width: 30px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; transition: transform .5s var(--lugn); }
  .film .tillbaka:hover svg { transform: translateX(-4px); }
  .film .inre { max-width: 960px; margin: 0 auto; padding: 40px 24px 0; }
  .film .huvud { text-align: center; margin: 0 auto 44px; }
  .film .huvud .skrift { font-size: clamp(46px, 7vw, 86px); margin-top: 14px; }
  .film .huvud .langd { margin-top: 10px; color: var(--dis); }
  .duk { position: relative; aspect-ratio: 16/9; background: #000; overflow: hidden; box-shadow: 0 40px 80px -30px rgba(0, 0, 0, .9); }
  .duk video { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  /* YouTube-lagret (titelrad, vattenstämpel, dela-ikoner) ligger i inbäddningens över- och underkant.
     Inbäddningen görs minst 64 px högre än rutan i vardera änden (YouTubes titelrad är ~60 px oavsett storlek): filmen letterboxas i mitten och banden med YouTubes
     gränssnitt hamnar utanför rutan, som klipper (overflow hidden). Bilden själv klipps inte. */
  .duk .halla { position: absolute; inset: 0; overflow: hidden; }
  .duk .halla { --band: clamp(64px, 13%, 110px); }
  .duk .halla iframe { position: absolute; left: 0; width: 100%; top: calc(-1 * var(--band)); height: calc(100% + 2 * var(--band)); border: 0; }
  .duk:fullscreen .halla, .duk.helskarm .halla { inset: auto; width: min(100vw, 177.78vh); height: min(100vh, 56.25vw); left: 50%; top: 50%; transform: translate(-50%, -50%); }
  .duk .snart { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; padding: 24px; }
  .duk .snart img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(.9) brightness(.35); }
  .duk .snart div { position: relative; }
  .duk .snart .brod { max-width: 420px; margin: 14px auto 0; font-size: 15px; }
  /* Egen spelarstyrning ovanpå YouTube (controls=0) eller <video> */
  .duk .bild { position: absolute; inset: 0; background-size: cover; background-position: center; z-index: 2; transition: opacity .8s var(--lugn), visibility 0s .8s; filter: brightness(.85); }
  .duk.igang .bild { opacity: 0; visibility: hidden; pointer-events: none; }
  .duk .lock { position: absolute; inset: 0; z-index: 3; }
  .duk .stor { position: absolute; inset: 0; z-index: 4; display: grid; place-items: center; pointer-events: none; opacity: 0; visibility: hidden; }
  .duk.paus:not(.igang) .stor, .duk.nyss .stor, .duk.visa .lock:hover ~ .stor { visibility: visible; }
  /* Ringen syns före första start, en kort stund efter paus, och vid hovring — inte permanent över bilden. */
  .duk.paus:not(.igang) .stor, .duk.nyss .stor, .duk.visa .lock:hover ~ .stor { opacity: 1; }
  .duk .lock { cursor: pointer; }
  .duk .stor span { width: 58px; height: 58px; border: 1px solid rgba(242, 197, 114, .75); border-radius: 50%; display: grid; place-items: center; color: var(--accent); background: rgba(23, 20, 20, .45); transition: transform .08s ease-out; }
  .duk .stor svg { width: 15px; height: 15px; fill: currentColor; }
  .duk .stor svg.spela-ikon { margin-left: 3px; }
  /* Mittknappen visar alltid aktuellt läge (play när det är pausat, paus när det spelar) och växlar
     direkt utan toning. Hovring fyller den, tryck trycker ihop den. */
  .duk.visa .lock:hover ~ .stor span, .duk.paus .lock:hover ~ .stor span { background: var(--accent); border-color: var(--accent); color: var(--bg); }
  .duk .lock:active ~ .stor span { transform: scale(.88); }
  .styr .knapp { transition: opacity .3s, color .25s, transform .2s var(--lugn); }
  .styr .knapp:hover { color: var(--accent); transform: scale(1.15); }
  .styr .knapp:active { transform: scale(.9); }
  .styr #duk-spela:hover { color: var(--accent); }

<script>
(async () => {
  const $ = (id) => document.getElementById(id);
  const data = await (await fetch("videor.json", { cache: "no-cache" })).json();
  const videor = data.videor;
  // Alltid animera — systemets "reducera rörelse" följs inte (Rickard 2026-09-06).
  const lugnt = false;
  const smal = () => matchMedia("(max-width: 700px)").matches;

  const norm = (s) => s.toLowerCase().replace(/[.,!?:;"“”()]/g, " ").replace(/\s+/g, " ").trim();
  const tid = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  const esc = (s) => s.replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
  const markera = (text, ord) => {
    let ut = esc(text);
    for (const o of ord) if (o.length > 1) ut = ut.replace(new RegExp(`(${o.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")})`, "gi"), "<mark>$1</mark>");
    return ut;
  };
  // Året berättelsen utspelar sig. Negativa år är före Kristus: −212 → "212 f.Kr."
  // Hårt mellanslag som tecken (inte &nbsp;) — används även i textContent.
  const arText = (ar) => (ar < 0 ? `${-ar} f.Kr.` : String(ar));
  // "Matematik 1c" → "Ma 1c"
  const kursKort = (kurs) => {
    const m = kurs.match(/(\d)\s*([a-c]*)$/i);
    return m ? `Ma&nbsp;${m[1]}${m[2].toLowerCase()}` : esc(kurs);
  };

  // ── Vyer och adress ───────────────────────────────────
  let aktivVy = null;
  function visa(namn) {
    if (aktivVy === namn) return;
    aktivVy = namn;
    document.querySelectorAll(".vy").forEach((el) => {
      const ar = el.id === `vy-${namn}`;
      el.classList.remove("in");
      el.classList.toggle("aktiv", ar);
      if (ar) requestAnimationFrame(() => el.classList.add("in"));
    });
    document.body.classList.toggle("last", namn === "intro" || (namn === "valj" && !smal()));
    document.body.classList.toggle("vy-film", namn === "film");
    window.scrollTo(0, 0);
    if (namn !== "film") stangSpelare();
  }
  function ruta() {
    const h = decodeURIComponent(location.hash.slice(1));
    if (!h) return visa("intro");
    if (h === "filmer") return visa("valj");
    const m = h.match(/^([\w-]+)(?:&t=(\d+))?/);
    const v = m && videor.find((x) => x.id === m[1]);
    if (!v) return visa("valj");
    visa("film");
    laddaFilm(v, m[2] ? Number(m[2]) : undefined);
  }
  window.addEventListener("hashchange", ruta);

  // ── Stjärnhimlen och stadens fönster ──────────────────
  // stjarnor.json är målningens egna ljuspunkter, uppmätta av verktyg/hitta-stjarnor.py:
  // { stjarnor: [x, y, radie vid 1600 px, ljushet, varmton], fonster: [x, y, radie, ljushet] }.
  // Att bara lägga ljus ovanpå syns inte: stjärnan är redan nästan vit. Därför pendlar varje
  // stjärna åt båda hållen: i den svaga fasen täcks hon av en mjuk fläck i himlens egen färg
  // (tagen ur fonden runt henne), i den starka fasen får hon en halo och en liten vit kärna.
  // Fönstren i staden glimrar tvärtom bara uppåt — varm glöd i lighter, ingen täckfläck —
  // långsammare och mjukare än stjärnorna, och några få flämtar till ibland.
  // Sprites ritas en gång och kopieras in
  // med drawImage, inget filter per bildruta. Slingan går bara när vyn syns.
  // Allt här är const-uttryck, inte function-deklarationer: i icke-strikt läge läcker en
  // deklaration i ett block ut till hela skriptet, och en rita() här slog ut tidslinjens rita().
  {
    const duk = $("stjarnor"), yta = duk.getContext("2d"), vy = $("vy-valj");
    const BILD_B = 1600, BILD_H = 900;  // fondens mått, samma som bygg.mjs bakar
    const dpr = () => Math.min(devicePixelRatio || 1, 2);
    const slump = (n) => { const v = Math.sin(n * 12.9898 + 78.233) * 43758.5453; return v - Math.floor(v); };
    let stjarnor = [], fonster = [], punkter = [], fonsterpunkter = [], halor = new Map(), bredd = 0, hojd = 0, kors = false, fondData = null;
    const FONSTERFARG = "255,214,150";   // stadens varma lyktljus

    // Fonden läses in en gång i 1600x900 så himlens färg runt varje stjärna kan tas därifrån.
    const fondImg = new Image();
    fondImg.onload = () => {
      const c = document.createElement("canvas"); c.width = BILD_B; c.height = BILD_H;
      const k = c.getContext("2d", { willReadFrequently: true });
      k.drawImage(fondImg, 0, 0, BILD_B, BILD_H);
      try { fondData = k.getImageData(0, 0, BILD_B, BILD_H).data; } catch (e) { fondData = null; }
      punkter = []; fonsterpunkter = []; startaStjarnor();
    };
    fondImg.src = vy.querySelector(".fond").getAttribute("src");

    const himmelFarg = (x, y, r) => {
      if (!fondData) return [40, 60, 100];
      let rr = 0, gg = 0, bb = 0, n = 0;
      for (let v = 0; v < 12; v++) {
        const px = Math.round(x + Math.cos(v / 12 * 2 * Math.PI) * r), py = Math.round(y + Math.sin(v / 12 * 2 * Math.PI) * r);
        if (px < 0 || py < 0 || px >= BILD_B || py >= BILD_H) continue;
        const i = (py * BILD_B + px) * 4; rr += fondData[i]; gg += fondData[i + 1]; bb += fondData[i + 2]; n++;
      }
      return n ? [Math.round(rr / n), Math.round(gg / n), Math.round(bb / n)] : [40, 60, 100];
    };

    const mjukFlack = (radie, rgb, kant) => {
      const k = dpr(), r = radie * k, sida = Math.max(2, Math.ceil(r * 2));
      const s = document.createElement("canvas"); s.width = s.height = sida;
      const c = s.getContext("2d");
      const g = c.createRadialGradient(sida / 2, sida / 2, 0, sida / 2, sida / 2, sida / 2);
      g.addColorStop(0, `rgba(${rgb},1)`);
      g.addColorStop(kant, `rgba(${rgb},.85)`);
      g.addColorStop(1, `rgba(${rgb},0)`);
      c.fillStyle = g; c.fillRect(0, 0, sida, sida);
      return s;
    };
    // sort: 0 = kall stjärna, 1 = varm stjärna, 2 = stadens fönster (mjukare glöd),
    // 3 = kärnpunkten mitt i den starka fasen (liten, nästan vit).
    const halo = (radie, sort) => {
      const nyckel = `${radie}|${sort}`;
      let h = halor.get(nyckel);
      if (h) return h;
      const k = dpr(), r = radie * k, sida = Math.max(2, Math.ceil(r * 2));
      h = document.createElement("canvas"); h.width = h.height = sida;
      const c = h.getContext("2d");
      const rgb = sort === 2 ? FONSTERFARG : sort === 3 ? "255,250,238" : sort === 1 ? "255,246,226" : "226,236,255";
      const g = c.createRadialGradient(sida / 2, sida / 2, 0, sida / 2, sida / 2, sida / 2);
      if (sort === 2) {            // fönstret: bredare, mjukare, ingen hård kärna
        g.addColorStop(0, `rgba(${rgb},.85)`);
        g.addColorStop(.3, `rgba(${rgb},.34)`);
        g.addColorStop(.65, `rgba(${rgb},.1)`);
        g.addColorStop(1, `rgba(${rgb},0)`);
      } else if (sort === 3) {     // kärnan: nästan solid mitt, snabbt utfall
        g.addColorStop(0, `rgba(${rgb},1)`);
        g.addColorStop(.45, `rgba(${rgb},.75)`);
        g.addColorStop(1, `rgba(${rgb},0)`);
      } else {
        g.addColorStop(0, `rgba(${rgb},.9)`);
        g.addColorStop(.25, `rgba(${rgb},.35)`);
        g.addColorStop(.6, `rgba(${rgb},.08)`);
        g.addColorStop(1, `rgba(${rgb},0)`);
      }
      c.fillStyle = g; c.fillRect(0, 0, sida, sida);
      halor.set(nyckel, h);
      return h;
    };

    // Glimret ska hamna på stjärnan, så räkningen följer fondens faktiska ruta: på datorn
    // har bilden sitt eget format (rutan = bilden), i mobilen object-fit: cover, center top.
    const fondEl = vy.querySelector(".fond");
    const matStjarnor = () => {
      bredd = duk.clientWidth; hojd = duk.clientHeight;
      if (!bredd || !hojd) { punkter = []; fonsterpunkter = []; return; }
      const k = dpr();
      duk.width = Math.round(bredd * k); duk.height = Math.round(hojd * k);
      yta.setTransform(k, 0, 0, k, 0, 0);
      halor.clear();
      const r = fondEl.getBoundingClientRect(), c = duk.getBoundingClientRect();
      const tackt = getComputedStyle(fondEl).objectFit === "cover";
      const skala = tackt ? Math.max(r.width / BILD_B, r.height / BILD_H) : r.width / BILD_B;
      const ox = r.left - c.left + (r.width - BILD_B * skala) / 2, oy = r.top - c.top;
      punkter = stjarnor.map(([x, y, s, b, v], i) => {
        const bx = x * BILD_B, by = y * BILD_H;
        const rTack = Math.max(2.5, s * skala * 1.8);      // täcker stjärnan själv med lite marginal
        const rHalo = Math.max(7, s * skala * 8);          // skenet runt henne, syns mot himlen
        return {
          x: ox + bx * skala, y: oy + by * skala, rTack, rHalo, rKarna: Math.max(1.6, rTack * .7),
          tack: mjukFlack(rTack, himmelFarg(bx, by, s * 3 + 3).join(","), .45),
          varm: v >= .5 ? 1 : 0,
          // Styrkan har provats fram 2026-09-23: fullt utslag var för intensivt, halva likaså,
          // en fjärdedel för lite. Nu ungefär 40 procent av det ursprungliga.
          damp: .27 + .15 * b,          // hur långt ner den svagaste fasen tar henne
          topp: .17 + .19 * b,          // halons styrka i den starka fasen
          fart: 2 * Math.PI / (3 + slump(i) * 4),   // ett varv på 3 till 7 sekunder
          fart2: 2 * Math.PI / (.9 + slump(i + 31) * 1.3), // ett snabbare, svagare flimmer ovanpå
          fas: slump(i + 977) * 2 * Math.PI,
        };
      });
      // Fönstren: bara glöd uppåt, ingen täckfläck (huset bakom är mörkt, en fläck i
      // väggens färg skulle synas som en prick). Långsammare gång än stjärnorna.
      fonsterpunkter = fonster.map(([x, y, s, b], i) => ({
        x: ox + x * BILD_B * skala, y: oy + y * BILD_H * skala,
        r: Math.max(4, s * skala * 5),
        bas: .10 + .10 * b,             // glöden som alltid ligger på
        amp: .22 + .30 * b,             // hur mycket den andas
        fart: 2 * Math.PI / (2 + slump(i + 7) * 3),      // ett varv på 2 till 5 sekunder
        fas: slump(i + 401) * 2 * Math.PI,
        flamt: slump(i + 617) < .15,    // några få flämtar till då och då
        flamtFart: 2 * Math.PI / (9 + slump(i + 863) * 8),
      }));
    };

    const levande = () => !document.hidden && vy.classList.contains("aktiv")
      && (punkter.length > 0 || fonsterpunkter.length > 0);

    const ritaStjarnor = (nu) => {
      if (!levande()) { kors = false; return; }
      const t = nu / 1000;
      yta.clearRect(0, 0, bredd, hojd);
      for (const p of punkter) {
        // f går 0..1: under 0,5 dämpas stjärnan, över 0,5 får hon halo och kärna.
        const f = .5 + .4 * Math.sin(t * p.fart + p.fas) + .1 * Math.sin(t * p.fart2 + p.fas * 3);
        if (f < .5) {
          yta.globalCompositeOperation = "source-over";
          yta.globalAlpha = (.5 - f) * 2 * p.damp;
          yta.drawImage(p.tack, p.x - p.rTack, p.y - p.rTack, p.rTack * 2, p.rTack * 2);
        } else {
          const styrka = (f - .5) * 2;
          yta.globalCompositeOperation = "lighter";
          yta.globalAlpha = styrka * p.topp;
          yta.drawImage(halo(p.rHalo, p.varm), p.x - p.rHalo, p.y - p.rHalo, p.rHalo * 2, p.rHalo * 2);
          // Kärnan ovanpå: en liten skarp prick, det som gör att ögat läser "glimt".
          yta.globalAlpha = styrka * styrka * .3;
          yta.drawImage(halo(p.rKarna, 3), p.x - p.rKarna, p.y - p.rKarna, p.rKarna * 2, p.rKarna * 2);
        }
      }
      yta.globalCompositeOperation = "lighter";
      for (const p of fonsterpunkter) {
        let a = p.bas + p.amp * (.5 + .5 * Math.sin(t * p.fart + p.fas));
        if (p.flamt) {   // ett kort mörkt flämt, ungefär var tionde sekund
          const g = Math.sin(t * p.flamtFart + p.fas * 2.7);
          if (g > .995) a *= 1 - .85 * ((g - .995) / .005);
        }
        yta.globalAlpha = a;
        yta.drawImage(halo(p.r, 2), p.x - p.r, p.y - p.r, p.r * 2, p.r * 2);
      }
      yta.globalAlpha = 1; yta.globalCompositeOperation = "source-over";
      requestAnimationFrame(ritaStjarnor);
    };

    const startaStjarnor = () => {
      // Vyn är display: none tills den blir aktiv, så måtten går inte att ta förrän då.
      if ((stjarnor.length || fonster.length) && !document.hidden && vy.classList.contains("aktiv")
          && ((!punkter.length && !fonsterpunkter.length) || duk.clientWidth !== bredd || duk.clientHeight !== hojd)) matStjarnor();
      if (kors || !levande()) return;
      kors = true;
      requestAnimationFrame(ritaStjarnor);
    };

    new MutationObserver(startaStjarnor).observe(vy, { attributes: true, attributeFilter: ["class"] });
    document.addEventListener("visibilitychange", startaStjarnor);
    addEventListener("resize", () => { matStjarnor(); startaStjarnor(); });
    fetch("stjarnor.json", { cache: "no-cache" })
      .then((r) => (r.ok ? r.json() : []))
      // Gamla formatet var en ren array med bara stjärnor; nya är { stjarnor, fonster }.
      .then((d) => {
        stjarnor = Array.isArray(d) ? d : (Array.isArray(d && d.stjarnor) ? d.stjarnor : []);
        fonster = Array.isArray(d && d.fonster) ? d.fonster : [];
        startaStjarnor();
      })
      .catch(() => {});
  }

  // ── Introt: levande stjärnor och ljus ─────────────────
  // Ingenting läggs ovanpå målningen. Bilden ritas som textur i en fragment-shader som
  // ändrar pixlarna själva (Rickard 2026-09-23):
  // - Stjärnorna i fönstret: masken intro-glimt.png (verktyg/hitta-intro.py) säger vilka
  //   pixlar som är stjärna, och vilken fas och takt varje stjärna har. Shadern skalar
  //   stjärnans överskott över himlen runt henne (en suddig mipnivå) upp och ner.
  // - Lågan: vickar i sidled, mest i toppen, och sträcks och krymper lite.
  // - Ljuset i rummet: bord, papper, ljusstake och händer ljusnar och mörknar med lågan.
  // Allt är bildpixlar i 1920x1080. Går WebGL2 inte att få ligger <img> kvar.
  {
    const vy = $("vy-intro"), duk = $("levande"), img = vy.querySelector(".fond");
    const GLIMT = "omslag/intro-glimt.png?v=3bc0ca9e";
    const gl = duk.getContext("webgl2", { alpha: false, antialias: false, depth: false, stencil: false, powerPreference: "low-power" });
    const HORN = `#version 300 es
      in vec2 a;
      uniform vec2 uSkala, uForskj;
      out vec2 vUv;
      void main() {
        vec2 s = vec2(a.x * .5 + .5, .5 - a.y * .5);   // skärmen, 0..1 uppifrån
        vUv = uForskj + s * uSkala;                     // bildens koordinater, som object-fit: cover
        gl_Position = vec4(a, 0., 1.);
      }`;
    const YTA = `#version 300 es
      precision highp float;
      uniform sampler2D uBild, uMask;
      uniform float uT;
      uniform vec2 uPx;
      in vec2 vUv;
      out vec4 ut;
      const vec2 LAGA = vec2(1667., 640.);      // lågans mitt
      const vec2 LAGA_R = vec2(13., 36.);       // området som får röra sig
      const float BAS = 672.;                   // lågans fot (veken)
      float h1(float n) { return fract(sin(n * 127.1) * 43758.5453); }
      float brus(float x) { float i = floor(x), f = fract(x); f = f * f * (3. - 2. * f); return mix(h1(i), h1(i + 1.), f); }
      void main() {
        vec2 px = vUv * uPx;
        // Lågan. w: 1 i lågan, tonar ut mot kanten. hojd: 0 vid veken, 1 i toppen.
        float w = smoothstep(1., .55, length((px - LAGA) / LAGA_R));
        float hojd = clamp((BAS - px.y) / 54., 0., 1.);
        float sving = (brus(uT * 1.6) - .5) * 1.4 + sin(uT * 8.7 + brus(uT * .6) * 6.) * .3;
        float strack = (brus(uT * 2.2 + 5.) - .5) * .16 * smoothstep(0., .15, hojd);
        vec2 kalla = px;
        kalla.x -= w * hojd * hojd * sving * 2.4;
        kalla.y = mix(px.y, BAS - (BAS - px.y) / (1. + strack), w);
        vec3 c = texture(uBild, kalla / uPx).rgb;
        // Stjärnorna: överskottet över himlen skalas mellan 25 och 170 procent, och i toppen
        // sprids stjärnans eget ljus ut i ett litet sken (55–125 syntes knappt, Rickard 2026-09-23).
        vec4 m = texture(uMask, vUv);
        if (m.r > .004) {
          vec3 himmel = textureLod(uBild, vUv, 4.).rgb;
          float g = .5 + .5 * sin(uT * (.7 + m.b * 1.4) + m.g * 6.2832);
          g = g * g * (3. - 2. * g);
          vec3 ny = himmel + (c - himmel) * mix(.25, 1.7, g);
          ny += max(textureLod(uBild, vUv, 1.5).rgb - himmel, 0.) * 1.1 * g * g;
          c = mix(c, ny, m.r);
        }
        // Ljuset i rummet andas med lågan: nära lågan mest, ut över bordet mindre.
        float fl = brus(uT * 2.4) * .5 + brus(uT * 5.7 + 3.) * .3 + brus(uT * 12.1 + 7.) * .2 - .5;
        vec2 d = (px - LAGA) / uPx.y;
        float r2 = dot(d, d);
        float rum = exp(-r2 / (2. * .22 * .22)), nara = exp(-r2 / (2. * .035 * .035));
        c *= 1. + fl * (.14 * rum + .4 * nara);
        c += vec3(1., .75, .42) * nara * fl * .12;
        ut = vec4(c, 1.);
      }`;
    const kompilera = (typ, kod) => {
      const s = gl.createShader(typ); gl.shaderSource(s, kod); gl.compileShader(s);
      if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));

    const ladda = (src) => new Promise((ok, fel) => { const i = new Image(); i.onload = () => ok(i); i.onerror = fel; i.src = src; });
    let prog = null, uT, uSkala, uForskj, redo = false, forlorad = false, kor = false, senast = 0, BW = 1920, BH = 1080;

    const mat = () => {
      const b = duk.clientWidth, h = duk.clientHeight;
      if (!b || !h || !prog) return;
      const k = Math.min(devicePixelRatio || 1, 2, Math.sqrt(4.2e6 / (b * h)));   // högst ~4 miljoner pixlar
      duk.width = Math.round(b * k); duk.height = Math.round(h * k);
      gl.viewport(0, 0, duk.width, duk.height);
      const s = Math.max(b / BW, h / BH), sx = b / (BW * s), sy = h / (BH * s);
      gl.uniform2f(uSkala, sx, sy); gl.uniform2f(uForskj, (1 - sx) / 2, (1 - sy) / 2);
      // Ny storlek tömmer duken: rita direkt, annars blinkar den svart en bildruta.
      gl.uniform1f(uT, performance.now() / 1000); gl.drawArrays(gl.TRIANGLES, 0, 3);
    };
    const levande = () => redo && !forlorad && !document.hidden && vy.classList.contains("aktiv");
    const rita = (nu) => {
      if (!levande()) { kor = false; return; }
      requestAnimationFrame(rita);
      if (nu - senast < 32) return;   // 30 bilder i sekunden räcker för ett ljus
      senast = nu;
      gl.uniform1f(uT, nu / 1000);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      duk.classList.add("klar");
    };
    const starta = () => {
      if (kor || !levande()) return;
      mat(); kor = true; requestAnimationFrame(rita);
    };
    const textur = (enhet, bild, mip, rak) => {
      const t = gl.createTexture();
      gl.activeTexture(gl.TEXTURE0 + enhet); gl.bindTexture(gl.TEXTURE_2D, t);
      gl.pixelStorei(gl.UNPACK_COLORSPACE_CONVERSION_WEBGL, rak ? gl.NONE : gl.BROWSER_DEFAULT_WEBGL);

    if (gl) Promise.all([ladda(img.currentSrc || img.src), ladda(GLIMT)]).then(([bild, mask]) => {
      prog = gl.createProgram();
      gl.attachShader(prog, kompilera(gl.VERTEX_SHADER, HORN));
      gl.attachShader(prog, kompilera(gl.FRAGMENT_SHADER, YTA));
      gl.linkProgram(prog);
      if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
      gl.useProgram(prog);
      const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);

      const a = gl.getAttribLocation(prog, "a"); gl.enableVertexAttribArray(a); gl.vertexAttribPointer(a, 2, gl.FLOAT, false, 0, 0);
      BW = bild.naturalWidth; BH = bild.naturalHeight;
      textur(0, bild, true, false); textur(1, mask, false, true);
      gl.uniform1i(gl.getUniformLocation(prog, "uBild"), 0); gl.uniform1i(gl.getUniformLocation(prog, "uMask"), 1);
      gl.uniform2f(gl.getUniformLocation(prog, "uPx"), BW, BH);

      redo = true; starta();
    }).catch((e) => { console.warn("Levande intro avstängt:", e); duk.remove(); });

    duk.addEventListener("webglcontextlost", (e) => { e.preventDefault(); forlorad = true; duk.classList.remove("klar"); });
    new MutationObserver(starta).observe(vy, { attributes: true, attributeFilter: ["class"] });
    document.addEventListener("visibilitychange", starta);
    addEventListener("resize", () => { if (redo) mat(); });
  }

  // ── Tidslinjen ────────────────────────────────────────
  const spar = $("spar"), tidslinje = $("tidslinje");
  spar.innerHTML = videor.map((v) => `
    <div class="post">
      <button data-film="${v.id}" aria-label="${esc(v.titel)} — ${esc(v.kurs)}, ${esc(v.moment)}">
        <span class="lyft"></span>
        <span class="ram">${(v.omslagRen || v.omslag) ? `<img src="${v.omslagRen || v.omslag}" alt="" loading="lazy" draggable="false">` : ""}</span>
        <span class="lina"></span>
        <span class="namn">
          <span class="kurs">${v.ar ? arText(v.ar) : kursKort(v.kurs)}</span>
          <span class="moment">${v.ar ? `${kursKort(v.kurs)} · ` : ""}${esc(v.moment)}</span>
          <span class="titel">${esc(v.titel)}</span>
        </span>
      </button>
    </div>`).join("") + [1, 2, 3].map(() => `
    <div class="post kommer" aria-hidden="true">
      <span class="lyft"></span><span class="ram"></span><span class="lina"></span>
      <span class="namn"><span class="kurs">· · ·</span><span class="moment">fler filmer kommer</span></span>
    </div>`).join("");

  let x = 0, vx = 0, mal = 0, rullar = false, drog = false;
  const maxX = () => Math.max(0, spar.scrollWidth - tidslinje.clientWidth);
  function rita() {
    spar.style.transform = `translate3d(${-x}px,0,0)`;
    $("hint").classList.toggle("borta", x > 40);
    $("aterstall").classList.toggle("syns", x > 40);
  }
  let malX = null; // sätts när tidslinjen ska glida till en bestämd punkt (t.ex. hela vägen till början)
  function loop() {
    if (lugnt) { x = Math.min(maxX(), Math.max(0, mal)); rita(); rullar = false; return; }
    if (malX != null) {
      x += (malX - x) * 0.14;
      if (Math.abs(malX - x) < 0.5) { x = malX; malX = null; vx = 0; rita(); rullar = false; return; }
      rita(); requestAnimationFrame(loop); return;
    }
    x += vx; vx *= 0.9;
    if (x < 0) { x = 0; vx = 0; } if (x > maxX()) { x = maxX(); vx = 0; }
    rita();
    if (Math.abs(vx) > 0.15) requestAnimationFrame(loop); else { rullar = false; }
  }
  function knuffa(d) {
    if (smal()) return;
    malX = null;
    if (lugnt) { mal = x + d; } else { vx += d * 0.12; }
    if (!rullar) { rullar = true; requestAnimationFrame(loop); }
  }
  $("vy-valj").addEventListener("wheel", (e) => {
    if (smal()) return;
    e.preventDefault();
    knuffa(Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY);
  }, { passive: false });
  let pekX = null, pekStartX = 0;
  // Pekaren tas i beslag först när man verkligen drar — annars hamnar klicket
  // på tidslinjen i stället för på omslaget.
  // Vänster eller höger knapp drar. Klick utan rörelse går som vanligt till omslaget.
  tidslinje.addEventListener("pointerdown", (e) => { if (smal() || (e.button !== 0 && e.button !== 2)) return; pekX = e.clientX; pekStartX = e.clientX; drog = false; vx = 0; malX = null; getSelection()?.removeAllRanges(); });
  tidslinje.addEventListener("selectstart", (e) => { if (!smal()) e.preventDefault(); });
  tidslinje.addEventListener("pointermove", (e) => {
    if (pekX == null) return;
    if (!drog) { if (Math.abs(e.clientX - pekStartX) <= 6) return; drog = true; tidslinje.classList.add("drar"); tidslinje.setPointerCapture(e.pointerId); }
    const dx = pekX - e.clientX; pekX = e.clientX;
    x = Math.min(maxX(), Math.max(0, x + dx)); vx = dx * 0.6; rita();
  });
  const slapp = () => { if (pekX == null) return; pekX = null; tidslinje.classList.remove("drar"); if (!lugnt && Math.abs(vx) > 0.5 && !rullar) { rullar = true; requestAnimationFrame(loop); } };
  tidslinje.addEventListener("pointerup", slapp); tidslinje.addEventListener("pointercancel", slapp);
  tidslinje.addEventListener("click", (e) => { if (drog) { e.stopPropagation(); e.preventDefault(); } drog = false; }, true);
  tidslinje.addEventListener("contextmenu", (e) => { if (drog || pekX != null) { e.preventDefault(); drog = false; } });
  $("aterstall").addEventListener("click", () => {
    if (lugnt) { mal = 0; x = 0; rita(); return; }
    malX = 0; vx = 0; if (!rullar) { rullar = true; requestAnimationFrame(loop); }
  });
  window.addEventListener("resize", () => { x = Math.min(x, maxX()); rita(); });
  document.addEventListener("keydown", (e) => {
    if (aktivVy !== "valj" || $("sok").classList.contains("oppen")) return;
    if (e.key === "ArrowRight") knuffa(240); if (e.key === "ArrowLeft") knuffa(-240);
  });

  // ── Sök ───────────────────────────────────────────────
  const sokRuta = $("sok"), falt = $("sok-falt");
  function sok(fraga) {
    const ord = norm(fraga).split(" ").filter(Boolean);
    if (!ord.length) return [];
    return videor.map((v) => {
      const huvud = norm([v.titel, v.kurs, v.moment, v.beskrivning, ...v.begrepp].join(" "));
      const huvudTraff = ord.every((o) => huvud.includes(o));
      const traffar = v.repliker.filter((r) => { const t = norm(r.text); return ord.every((o) => t.includes(o)); });
      return { v, huvudTraff, traffar };
    }).filter((x) => x.huvudTraff || x.traffar.length);
  }
  function ritaSok() {
    const fraga = falt.value, ord = norm(fraga).split(" ").filter(Boolean), res = sok(fraga);
    $("sok-lista").innerHTML = res.map(({ v, traffar }) => `
